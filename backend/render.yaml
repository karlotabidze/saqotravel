services:
  - type: web
    name: saqotravel-places-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: SYNC_TOKEN
        sync: false
      - key: PLACES_LANGUAGE_CODE
        value: ka
      - key: DETAILS_PAGE_SIZE
        value: 30
